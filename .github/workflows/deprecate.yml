name: deprecate

# Manual, dispatch-only maintenance workflow that marks the known-broken
# published @useauthio releases as deprecated on npm. These versions were the
# uninstallable / no-op-middleware releases (unresolvable `file:` deps) and are
# superseded by fixed `latest` versions, so installs should not land on them.
#
# AUTH — same org-level token used to publish:
# `NODE_AUTH_TOKEN` reads `secrets.NPM_TOKEN`, an ORGANIZATION-level GitHub
# Actions secret (granular token, Read+write on the @useauthio scope).
# `npm deprecate` is a write op the token can perform — same credential that
# publishes these packages. The CI-only token is never available locally, which
# is why this runs through Actions. `actions/setup-node` with `registry-url`
# writes the project `.npmrc` with `//registry.npmjs.org/:_authToken` wired to
# `NODE_AUTH_TOKEN`, so no token value is ever echoed.
#
# Re-runnable and harmless: re-deprecating an already-deprecated version just
# re-sets the same message. Only ever touches the four broken versions below —
# never the fixed `latest` releases, and never the old `@authio/*` names (a
# different scope our token is not scoped to).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Deprecate broken releases
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm deprecate "@useauthio/react@0.2.0" "Broken install (unresolvable @useauthio/node file: dep); upgrade to >=0.2.2"
          npm deprecate "@useauthio/vue@0.2.0" "Broken install; upgrade to >=0.2.3"
          npm deprecate "@useauthio/svelte@0.2.0" "Broken install; upgrade to >=0.2.2"
          npm deprecate "@useauthio/widgets@0.3.0" "Broken install; upgrade to >=0.3.1"
      - name: Skip (no NPM_TOKEN secret)
        if: env.NPM_TOKEN == ''
        run: |
          echo "::error::NPM_TOKEN secret is not set; cannot deprecate."
          exit 1
